# Menjaga backend & database tetap "hangat".
# Server (Vercel) dan database (Neon) paket gratis tertidur saat tidak dipakai, sehingga
# permintaan pertama butuh ±5 detik. Panggilan ringan tiap 5 menit membuat aplikasi selalu responsif.
name: Keep API warm

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Panggil health check (menyentuh server + database)
        run: |
          for attempt in 1 2 3; do
            if curl --silent --show-error --fail --max-time 25 https://dubidu-api.vercel.app/api/health; then
              echo; exit 0
            fi
            sleep 5
          done
          echo "API tidak merespons" && exit 1
